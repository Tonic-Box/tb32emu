<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tb32emu</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="/vendor/vt.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span class="brand">tb32emu</span>
    <span class="dim">TB32 emulator</span>
    <span class="grow"></span>
    <button id="config" class="tbtn" title="Run configuration">Config</button>
    <button id="assemble" class="tbtn" title="Assemble (Ctrl-B)">Assemble</button>
    <button id="run" class="tbtn tbtn-run" title="Run">Run</button>
    <button id="stop" class="tbtn" title="Stop" disabled>Stop</button>
  </header>
  <div id="tabbar"></div>
  <div id="workspace">
    <div id="editor-pane"><div id="editor"></div></div>
    <aside id="debug-pane">
      <h2>Registers</h2>
      <p class="hint">Run or step a program to inspect CPU state.</p>
    </aside>
  </div>
  <div id="bottom">
    <div id="bottom-tabs">
      <button class="btab active" data-panel="console">Console</button>
      <button class="btab" data-panel="terminal">Terminal</button>
      <span class="grow"></span>
      <button id="clear-console" class="clearbtn" title="Clear console">clear</button>
    </div>
    <div id="bottom-body">
      <pre id="console" class="panel active"></pre>
      <div id="terminal" class="panel">
        <div class="term-status">
          <span id="term-dot" class="dot dot-idle"></span>
          <span id="term-state">idle</span>
        </div>
        <div id="term-host"></div>
      </div>
    </div>
  </div>
</div>

<div id="config-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Run configuration</h2>
    <label for="cfg-args">Arguments</label>
    <input id="cfg-args" type="text" spellcheck="false" placeholder="arg1 arg2">
    <label for="cfg-env">Environment (KEY=VALUE per line)</label>
    <textarea id="cfg-env" rows="4" spellcheck="false" placeholder="HOME=/root"></textarea>
    <label for="cfg-seed">RNG seed (blank = random)</label>
    <input id="cfg-seed" type="text" spellcheck="false" placeholder="e.g. 42">
    <div class="modal-actions">
      <button id="cfg-cancel" class="tbtn">Cancel</button>
      <button id="cfg-save" class="tbtn tbtn-run">Save</button>
    </div>
  </div>
</div>

<script src="/vendor/codemirror/codemirror.min.js"></script>
<script src="/vendor/codemirror/simple.min.js"></script>
<script src="/vendor/vt.js"></script>
<script src="/editor.js"></script>
<script src="/terminal.js"></script>
<script src="/debugger.js"></script>
<script src="/app.js"></script>
</body>
</html>
